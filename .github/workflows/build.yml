name: Build APK and Daemon

on:
  push:
    branches:
      - main
      - legacy
      - dev/*
  workflow_dispatch:
    # 手动触发时可勾选要构建的额外产物，默认都不构建（anland-v5 始终构建）
    inputs:
      build_tracy:
        description: '构建 anland-v5-tracy（性能分析客户端）'
        type: boolean
        default: false
      build_daemon:
        description: '构建 anland-daemon / Magisk 模块'
        type: boolean
        default: false
  workflow_call:
    # 可复用工作流入口（release.yml 调用）：release 需要 daemon，必须显式传 true
    inputs:
      build_tracy:
        description: '构建 anland-v5-tracy（性能分析客户端）'
        type: boolean
        required: false
        default: false
      build_daemon:
        description: '构建 anland-daemon / Magisk 模块'
        type: boolean
        required: false
        default: false

jobs:
  # 根据触发方式决定构建哪些产物，并拼出 build-apk 的 matrix。
  # - workflow_dispatch / workflow_call：用勾选框 / 传参的值（默认 false）
  # - push：没有勾选框可用，沿用原来的行为（plain + daemon，不构建 tracy）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_tracy: ${{ steps.plan.outputs.build_tracy }}
      build_daemon: ${{ steps.plan.outputs.build_daemon }}
    steps:
      - name: Plan build matrix
        id: plan
        env:
          INPUT_BUILD_TRACY: ${{ inputs.build_tracy }}
          INPUT_BUILD_DAEMON: ${{ inputs.build_daemon }}
        run: |
          set -euo pipefail

          # push 触发的 inputs 是空字符串；显式传入的 false 也是非空，可据此区分
          BUILD_TRACY="${INPUT_BUILD_TRACY:-false}"
          BUILD_DAEMON="${INPUT_BUILD_DAEMON:-true}"

          PLAIN='{"task":"assemblePlainRelease","name":"anland-v5","apk":"plain/release/app-plain-release.apk"}'
          TRACY='{"task":"assembleTracyRelease","name":"anland-v5-tracy","apk":"tracy/release/app-tracy-release.apk"}'
          if [ "$BUILD_TRACY" = "true" ]; then
            MATRIX="{\"include\":[$PLAIN,$TRACY]}"
          else
            MATRIX="{\"include\":[$PLAIN]}"
          fi

          {
            echo "matrix=$MATRIX"
            echo "build_tracy=$BUILD_TRACY"
            echo "build_daemon=$BUILD_DAEMON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 构建计划"
            echo ""
            echo "| 产物 | 构建 |"
            echo "| --- | --- |"
            echo "| anland-v5 | ✅ |"
            echo "| anland-v5-tracy | $([ "$BUILD_TRACY" = "true" ] && echo "✅" || echo "⏭️ 跳过") |"
            echo "| anland-daemon | $([ "$BUILD_DAEMON" = "true" ] && echo "✅" || echo "⏭️ 跳过") |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-apk:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # anland-v5 始终构建；anland-v5-tracy（Tracy 性能分析客户端，见 app/build.gradle
      # 的 product flavors，tracy flavor 额外带 Tracy 监听所需的 INTERNET 权限）
      # 由 prepare 决定是否加入 matrix。Tracy 构建会在 configure 阶段克隆
      # jni/CMakeLists.txt 里固定的 tag。
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields the real commit
          # count for versionCode (shallow checkout would make it always 1).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Set NDK_DIR environment variable
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 四个 secret 齐全才算"配置了发布签名"，缺任一个都退回 debug keystore
          # （不能 exit 1：那样 debug keystore 兜底步骤就没机会跑了）
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "release keystore 配置不全（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），退回 debug keystore。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          # 容忍 secret 里带换行（base64 按行折叠）或 CRLF
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::secrets.KEYSTORE_BASE64 解码后为空，请确认它是 keystore 文件的 base64 编码。"
            exit 1
          fi
          # 提前验证密码/alias 可用，避免等到 gradle 打包时才失败
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > /dev/null
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "configured=true" >> "$GITHUB_OUTPUT"
          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate debug keystore
        if: steps.keystore.outputs.configured != 'true'
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US" -noprompt
          {
            echo "KEYSTORE_FILE=$HOME/.android/debug.keystore"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=androiddebugkey"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Run Android unit tests
        if: matrix.task == 'assemblePlainRelease'
        working-directory: consumers/anland_v5/android_consumer
        run: |
          chmod +x gradlew
          ./gradlew testPlainDebugUnitTest

      - name: Build APK
        working-directory: consumers/anland_v5/android_consumer
        run: |
          chmod +x gradlew
          # Pass signing as project properties on the command line instead of
          # appending to the tracked gradle.properties, which would dirty the working
          # tree and make the git-derived versionName ("...-dirty") wrong on CI.
          # KEYSTORE_* 由上面的 "Decode release keystore" 或 "Generate debug keystore"
          # 写入 $GITHUB_ENV：仓库配了 secrets.KEYSTORE_BASE64 就是发布签名，否则是 debug。
          ./gradlew ${{ matrix.task }} \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/${{ matrix.apk }} \
             app/build/outputs/apk/${{ matrix.name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}.apk
          path: consumers/anland_v5/android_consumer/app/build/outputs/apk/${{ matrix.name }}.apk
          archive: false
          overwrite: true

  build-daemon:
    needs: prepare
    if: needs.prepare.outputs.build_daemon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Set NDK_DIR environment variable
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Configure CMake for Android
        run: |
          cmake -S . -B build_daemon_android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build display_daemon
        run: cmake --build build_daemon_android --target display_daemon -j$(nproc)

      - name: Copy daemon to magisk_module directory
        run: |
          cp build_daemon_android/display_daemon magisk_module/
          chmod 755 magisk_module/display_daemon

      - name: Upload Magisk module
        uses: actions/upload-artifact@v7
        with:
          name: anland-daemon
          path: magisk_module/
